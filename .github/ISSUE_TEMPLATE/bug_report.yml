name: "🐛 Bug Report"
description: "File a bug report for rendering errors, CLI crashes, or audio issues"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment & Runtime
      description: OS version, Node version, and Agent CLI (Claude, Codex, Antigravity, or terminal).
      placeholder: "Windows 11, Node 24.19, Claude Code 2.1"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact commands executed when the error occurred.
      placeholder: "1. node scripts/studio_engine.mjs\n2. Select option [1]\n3. ..."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Terminal Output / Error Logs
      description: Paste any error messages or stack traces here.
      render: shell
