name: diag-carrossel (temporário)

on:
  pull_request:

jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        modo: [padrao, serial]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - run: pnpm install --frozen-lockfile
      - name: e2e inteiro, com relatório por teste (${{ matrix.modo }})
        env:
          VIBE_DEBUG: '1'
        run: |
          nproc
          if [ "${{ matrix.modo }}" = serial ]; then C="--test-concurrency=1"; else C=""; fi
          timeout 540 node --test $C --test-timeout=240000 --test-reporter=spec "tests/e2e/*.test.mjs" "tests/adversarial/*.test.mjs" 2>&1 | grep -E "carrossel|▶|✖|ℹ|passou de|reel|Error" | tail -80
          echo "saida=${PIPESTATUS[0]}"
